version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Amman
    open-pull-requests-limit: 5
    groups:
      nuget-servicing:
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Asia/Amman
    open-pull-requests-limit: 3
    groups:
      actions-servicing:
        update-types:
          - patch
          - minor

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Asia/Amman
    open-pull-requests-limit: 3
    groups:
      container-servicing:
        update-types:
          - patch
          - minor
